<!doctype html>

    <!-- =====================================================
         PERFORMANCE: Resource hints — establish connections
         early so fonts & images don't wait for DNS on 2G/3G
         ===================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- =====================================================
         PERFORMANCE: Theme colour avoids a flash of white
         before CSS loads on slow connections
         ===================================================== -->
    <meta name="theme-color" content="#F8F7F5" />

    <!-- Open Graph -->
    <meta property="og:title" content="Radhe Jewellers — Fine Jewellery in Bhadaj" />
    <meta property="og:description" content="Crafting timeless elegance in Bhadaj. Explore the collection or chat with us on WhatsApp." />
    <meta property="og:type" content="website" />
